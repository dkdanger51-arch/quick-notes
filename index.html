<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Notes</title>
    <!-- Theme set early so the page doesn't flash the wrong colors -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme') || localStorage.getItem('them');
                if (t !== 'dark' && t !== 'light') {
                    t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = t;
            } catch (e) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="logo" aria-hidden="true">✎</span>
                <h1>Quick Notes</h1>
                <span id="noteCount" class="badge">0 notes</span>
            </div>

            <div class="search">
                <input id="searchInput" type="search" placeholder="Search notes..." aria-label="Search notes"
                    autocomplete="off">
            </div>

            <div class="actions">
                <button id="themeBtn" class="icon-btn" type="button" aria-label="Switch theme">🌙</button>
                <button id="deleteAllBtn" class="btn btn-ghost danger" type="button">Delete All</button>
                <button id="addNoteBtn" class="btn btn-primary" type="button">+ Add Note</button>
            </div>
        </header>

        <main>
            <section id="notesGrid" class="grid" aria-live="polite"></section>

            <div id="emptyState" class="empty" hidden>
                <div class="empty-icon" aria-hidden="true">📝</div>
                <h2 id="emptyTitle">No notes yet</h2>
                <p id="emptyText">Click “Add Note” to write your first note.</p>
            </div>
        </main>
    </div>

    <dialog id="noteDialog" aria-labelledby="dialogTitle">
        <form id="noteForm" method="dialog">
            <div class="dialog-head">
                <h2 id="dialogTitle">Add New Note</h2>
                <button id="closeDialogBtn" class="icon-btn" type="button" aria-label="Close">✕</button>
            </div>

            <label for="titleInput">Title</label>
            <input id="titleInput" type="text" maxlength="60" placeholder="Enter title" required autocomplete="off">

            <label for="contentInput">Content</label>
            <textarea id="contentInput" rows="6" placeholder="Write your note here..." required></textarea>

            <fieldset class="colors">
                <legend>Color</legend>
                <label class="swatch-opt" title="Default">
                    <input type="radio" name="color" value="default" checked>
                    <span class="swatch" data-color="default"></span>
                </label>
                <label class="swatch-opt" title="Yellow">
                    <input type="radio" name="color" value="yellow">
                    <span class="swatch" data-color="yellow"></span>
                </label>
                <label class="swatch-opt" title="Green">
                    <input type="radio" name="color" value="green">
                    <span class="swatch" data-color="green"></span>
                </label>
                <label class="swatch-opt" title="Blue">
                    <input type="radio" name="color" value="blue">
                    <span class="swatch" data-color="blue"></span>
                </label>
                <label class="swatch-opt" title="Pink">
                    <input type="radio" name="color" value="pink">
                    <span class="swatch" data-color="pink"></span>
                </label>
                <label class="swatch-opt" title="Purple">
                    <input type="radio" name="color" value="purple">
                    <span class="swatch" data-color="purple"></span>
                </label>
            </fieldset>

            <div class="dialog-actions">
                <button id="cancelBtn" class="btn btn-ghost" type="button">Cancel</button>
                <button class="btn btn-primary" type="submit">Save Note</button>
            </div>
        </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden>
        <span id="toastText"></span>
        <button id="undoBtn" class="toast-btn" type="button" hidden>Undo</button>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
